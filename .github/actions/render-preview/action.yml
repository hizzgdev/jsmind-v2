name: Render preview
description: >-
  Render a mind map file to a PNG and post it on the pull request. Renders
  through the public export path, so the picture reviewers look at is produced
  by the same code a caller uses.

inputs:
  data-file:
    description: Mind map JSON to render.
    required: false
    default: examples/v2-features.json
  output:
    description: Path to write the image to.
    required: false
    default: tmp/preview.png
  width:
    description: Viewport width to lay the map out in, in CSS pixels.
    required: false
    default: '800'
  height:
    description: Viewport height to lay the map out in, in CSS pixels.
    required: false
    default: '600'
  repo:
    description: Repository as owner/name.
    required: true
  pr-number:
    description: >-
      Pull request to comment on. Empty renders the image and stops, which is
      what a push to master wants.
    required: false
    default: ''
  head-sha:
    description: Commit the image was rendered from, named in the comment.
    required: false
    default: ''
  upload-token:
    description: >-
      Token with write access, used only for the upload. Empty skips the upload
      and the comment - forks never receive repository secrets.
    required: false
    default: ''

outputs:
  url:
    description: URL of the uploaded image, empty when nothing was uploaded.
    value: ${{ steps.upload.outputs.url }}

runs:
  using: composite
  steps:
    - name: Check the browser export needs is present
      shell: bash
      run: |
        # Fail here with a clear message rather than inside the export, where a
        # missing browser reads like a rendering bug. chromium-browser is the
        # name Ubuntu ships; google-chrome is what the hosted runners carry.
        google-chrome --version || chromium-browser --version

    - name: Render
      shell: bash
      run: |
        # Through the public export path, not a private script: whatever the
        # API produces is what gets reviewed, so a regression here is the same
        # one a caller would hit.
        node dist/cli.js export "${{ inputs.data-file }}" "${{ inputs.output }}" \
          --width "${{ inputs.width }}" \
          --height "${{ inputs.height }}"

    # The image goes up as a comment attachment, in two steps with different
    # tokens.
    #
    # Step one uploads to https://uploads.github.com/user-attachments/assets,
    # the endpoint gh's own --attach posts to, and gets back
    # https://github.com/user-attachments/assets/<uuid>. That URL names a blob,
    # not a commit, so rebases and force-pushes leave it alone.
    #
    # Step two posts the comment with github.token, so it is attributed to
    # github-actions[bot] like every other CI comment. Using --attach would have
    # done both in one command but under a single credential, and there is no way
    # to say "upload as the maintainer, post as the bot" to a command that only
    # takes one token.
    - name: Upload
      id: upload
      if: inputs.upload-token != '' && inputs.pr-number != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        UPLOAD_TOKEN: ${{ inputs.upload-token }}
        REPO: ${{ inputs.repo }}
        IMAGE: ${{ inputs.output }}
      run: |
        set -euo pipefail

        # github.token only reads the numeric repository id and makes no writes.
        # gh refuses to run in Actions without it even for a plain `gh api` read.
        repo_id=$(gh api "repos/$REPO" --jq .id)

        # --data-binary, not --data: the latter mangles the payload. The query
        # string is what the endpoint reads for the content type, so it has to
        # survive URL encoding unchanged.
        response=$(curl -sS -X POST \
          "https://uploads.github.com/user-attachments/assets?content_type=image%2Fpng&name=preview.png&repository_id=$repo_id" \
          -H "Authorization: Bearer $UPLOAD_TOKEN" \
          -H "Content-Type: application/octet-stream" \
          --data-binary @"$IMAGE")

        url=$(printf '%s' "$response" | jq -r '.url // empty')
        if [ -z "$url" ]; then
          echo "::error::Upload failed: $response"
          exit 1
        fi

        echo "url=$url" >> "$GITHUB_OUTPUT"
        echo "uploaded $(du -h "$IMAGE" | cut -f1) to $url"

    - name: Post it on the pull request
      if: steps.upload.outputs.url != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PREVIEW_URL: ${{ steps.upload.outputs.url }}
        PR_NUMBER: ${{ inputs.pr-number }}
        FULL_SHA: ${{ inputs.head-sha }}
        RUN_ID: ${{ github.run_id }}
        REPO: ${{ inputs.repo }}
        DATA_FILE: ${{ inputs.data-file }}
      run: |
        set -euo pipefail
        short="${FULL_SHA:0:7}"

        # Invisible marker so a re-run can find and replace this comment.
        # Without it every push would leave its own screenshot behind and the
        # pull request would collect a column of images, all but the last
        # describing code that no longer exists.
        MARKER='<!-- jsmind-render-preview -->'

        # Clear any previous preview first. Deleting before posting means a
        # failure leaves the old image in place instead of no image at all.
        previous=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
          --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" || true)
        for id in $previous; do
          echo "removing previous preview comment $id"
          gh api -X DELETE "repos/$REPO/issues/comments/$id" || true
        done

        # Unquoted heredoc delimiter so the variables interpolate; backticks are
        # escaped so the shell does not run them as commands.
        #
        # Every paragraph below is one long line on purpose. GitHub renders
        # comments with breaks:true, so a single newline becomes a <br> -
        # wrapping a sentence to fit the source column posts it as a stack of
        # short lines instead of the paragraph it reads as here.
        cat > tmp/comment.md <<BODY
        $MARKER
        ### Render preview

        ![jsMind render preview]($PREVIEW_URL)

        Rendered from the latest code on this branch, at \`$short\`.

        **Worth a look for anything odd** - overlapping nodes, missing edges, text spilling outside its box, a lopsided layout. The tests check that the geometry is computed correctly; whether it actually *looks* right is the one thing they cannot tell you, and the one thing this image is for.

        [Workflow run](https://github.com/$REPO/actions/runs/$RUN_ID)
        <sub>Generated by \`jsmind export\` from \`$DATA_FILE\`, pinned to this commit. Uploaded as a comment attachment, so it stays viewable for as long as this comment exists.</sub>
        BODY

        gh pr comment "$PR_NUMBER" \
          --repo "$REPO" \
          --body-file tmp/comment.md