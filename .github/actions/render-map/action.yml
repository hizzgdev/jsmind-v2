name: Render map
description: >-
  Render a mind map file to a PNG, through the public export path.

  Needs a browser and nothing else - no token, no pull request, no repository
  context. Uploading the result and commenting on a pull request happen in the
  workflow that calls this, because they need credentials this action has no
  business holding.

inputs:
  data-file:
    description: Mind map JSON to render.
    required: false
    default: example/v2-features.json
  output:
    description: Path to write the image to.
    required: false
    default: tmp/preview.png
  width:
    description: Viewport width to lay the map out in, in CSS pixels.
    required: false
    default: '800'
  height:
    description: Viewport height to lay the map out in, in CSS pixels.
    required: false
    default: '600'
  transparent:
    description: >-
      Leave the canvas background transparent instead of filling it with the
      theme's background color. Opt-in, and the default is opaque: this action
      has more than one caller, and a default of "transparent" would restyle
      every one of their images without them asking. PNG and WebP only; the
      export ignores it for JPEG, which has no alpha channel.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Check the browser is present
      shell: bash
      run: |
        # Fail here with a clear message rather than inside the export, where a
        # missing browser reads like a rendering bug. chromium-browser is the
        # name Ubuntu ships; google-chrome is what the hosted runners carry.
        google-chrome --version || chromium-browser --version

    - name: Render
      shell: bash
      env:
        # Read through the environment rather than interpolating `${{ inputs.* }}`
        # into the script body: an input is a string from a caller, and a
        # caller's string belongs in a variable, not in shell source.
        DATA_FILE: ${{ inputs.data-file }}
        OUTPUT: ${{ inputs.output }}
        WIDTH: ${{ inputs.width }}
        HEIGHT: ${{ inputs.height }}
        TRANSPARENT: ${{ inputs.transparent }}
      run: |
        # Through the public export path, not a private script: whatever the API
        # produces is what gets reviewed, so a regression here is the same one a
        # caller would hit.
        #
        # The wrapper runs that same command and adds one retry, and only for a
        # browser that failed to start (exit 3 with "Browser startup failed" on
        # stderr). That is the one failure here that is about the runner rather
        # than about the code - the same image has taken 3s and 10s to launch
        # Chrome on consecutive runs. Everything else fails once, as it should.
        args=("$DATA_FILE" "$OUTPUT" --width "$WIDTH" --height "$HEIGHT")

        # Opt-in, per the input's own note: render-map has callers besides the
        # preview, and their images stay opaque unless they ask.
        if [ "$TRANSPARENT" = "true" ]; then
          args+=(--transparent)
        fi

        node scripts/render-preview.ts "${args[@]}"
