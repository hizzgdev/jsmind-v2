name: attach matrix

# Temporary. Three jobs, identical command, different permission declarations.
# First attempt attached a README.md and every job failed on
# "not a supported file type" — which says nothing about permissions. This one
# writes a real PNG first.

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  no-permissions-block:
    name: 1. No permissions block
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Probe
        env:
          GH_TOKEN: ${ secrets.${ secrets.GITHUB_TOKEN } }
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "gh: $(gh --version | head -1)"
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAEAAAAAgCAIAAAAt/+nTAAAAN0lEQVR42u3PQQkAAAgEsAtmMMMaxgw+hcEKLNXzWgQEBAQEBAQEBAQEBAQEBAQEBAQEBAQErhbuBYC1WRI4qAAAAABJRU5ErkJggg==' | base64 -d > probe.png
          file probe.png
          set +e
          out=$(gh pr comment "$PR" --repo "$REPO" --attach 'probe.png#probe' --body "matrix 1" 2>&1)
          set -e
          echo "EXIT=$?"
          echo "$out"

  pull-requests-only:
    name: 2. pull-requests:write only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAEAAAAAgCAIAAAAt/+nTAAAAN0lEQVR42u3PQQkAAAgEsAtmMMMaxgw+hcEKLNXzWgQEBAQEBAQEBAQEBAQEBAQEBAQEBAQErhbuBYC1WRI4qAAAAABJRU5ErkJggg==' | base64 -d > probe.png
          file probe.png
          set +e
          out=$(gh pr comment "$PR" --repo "$REPO" --attach 'probe.png#probe' --body "matrix 2" 2>&1)
          set -e
          echo "EXIT=$?"
          echo "$out"

  contents-write:
    name: 3. contents:write + pull-requests:write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAEAAAAAgCAIAAAAt/+nTAAAAN0lEQVR42u3PQQkAAAgEsAtmMMMaxgw+hcEKLNXzWgQEBAQEBAQEBAQEBAQEBAQEBAQEBAQErhbuBYC1WRI4qAAAAABJRU5ErkJggg==' | base64 -d > probe.png
          file probe.png
          set +e
          out=$(gh pr comment "$PR" --repo "$REPO" --attach 'probe.png#probe' --body "matrix 3" 2>&1)
          set -e
          echo "EXIT=$?"
          echo "$out"
