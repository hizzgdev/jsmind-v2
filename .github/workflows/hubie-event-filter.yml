# Filter GitHub events, then forward only Hubie-relevant ones to the
# Coordinator routine webhook. Filter rules live in
# team/automations/hubie/forward-github-event.sh and are described in
# team/automations/hubie/agent-team-collaboration.md section 6.
#
# Secrets (set by a repository admin after the routine is switched to
# a webhook trigger):
#   HUBIE_ROUTINE_WEBHOOK_URL
#   HUBIE_ROUTINE_WEBHOOK_KEY
# If either secret is missing, matching events are skipped without failing.

name: Forward Hubie events

on:
  issues:
    types: [assigned]
  pull_request:
    # closed is the only pull_request action this workflow acts on: opened,
    # synchronize and reopened only ever ran the filter's unit tests, and those
    # run in CI now.
    types: [closed]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  # Production, not a gate. Every event listed above is one the filter can
  # forward, and what it decides against is skipped inside the script
  # (`skip: ...`, exit 0) - so there is no job-level condition to restate the
  # trigger here. The script is the filter; this job is the runner around it.
  forward:
    name: Custom webhook
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter and forward
        env:
          HUBIE_ROUTINE_WEBHOOK_URL: ${{ secrets.HUBIE_ROUTINE_WEBHOOK_URL }}
          HUBIE_ROUTINE_WEBHOOK_KEY: ${{ secrets.HUBIE_ROUTINE_WEBHOOK_KEY }}
        run: bash team/automations/hubie/forward-github-event.sh
