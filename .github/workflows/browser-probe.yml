name: Browser probe

# Temporary: answers whether a render test can run on GitHub's runners.
# Not wired into ci.yml on purpose — this is the experiment, not the result.

on:
  workflow_dispatch:
  push:
    branches: [test/browser-ci-probe]

jobs:
  probe:
    name: Can render tests run here?
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # What ships with the image, before anything is installed.
      - name: Inventory the runner
        run: |
          echo "--- runner ---"
          uname -a
          cat /etc/os-release | head -3
          echo "--- browsers on PATH ---"
          for b in chromium chromium-browser google-chrome google-chrome-stable; do
            printf '%-22s' "$b"
            command -v "$b" || echo "(absent)"
          done
          echo "--- common install locations ---"
          ls -1 /usr/bin/*chrom* 2>/dev/null || echo "  no chromium in /usr/bin"
          ls -1 /opt/google/chrome/chrome 2>/dev/null || echo "  no google-chrome in /opt"
          echo "--- apt candidates ---"
          apt-cache policy chromium chromium-browser google-chrome-stable 2>/dev/null | head -20

      - name: Probe browser without installing anything
        id: bare
        continue-on-error: true
        run: node --experimental-strip-types --no-warnings scripts/probe-browser.ts

      - name: Install a browser when the image has none
        id: install
        if: steps.bare.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "Probing user-space install: chrome-for-testing"
          # Known-good Chrome for Testing build, no snap, no root required.
          curl -fsSL -o /tmp/cft.zip \
            "https://storage.googleapis.com/chrome-for-testing-public/131.0.6778.87/linux64/chrome-linux64.zip"
          unzip -q /tmp/cft.zip -d /tmp/cft
          /tmp/cft/chrome-linux64/chrome --version
          echo "CHROME_PATH=/tmp/cft/chrome-linux64/chrome" >> "$GITHUB_ENV"

      - name: Probe again with whatever we ended up with
        if: steps.bare.outcome == 'failure'
        run: node --experimental-strip-types --no-warnings scripts/probe-browser.ts