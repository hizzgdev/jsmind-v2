name: Render preview

# Posts a picture of the current renderer output on every pull request.
#
# The example map is deliberately ASCII. The runner ships no CJK font, and adding
# one costs a large download that dominated the job — for a preview whose only
# job is to show the layout, English labels carry the same information.
#
# Tests answer "is the geometry right". They cannot answer "does it look like
# anything" — a map can pass every assertion and still be unusable, with labels
# stacked on top of each other or the whole drawing stranded in a corner. A
# picture catches that in the half second it takes to glance at it.

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Render and post a screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      # Not `read`. `gh pr comment --attach` uploads the image to GitHub's asset
      # store, and GitHub counts that as a repository write — with contents:read
      # it fails with "attaching files requires write access to the repository"
      # even though pull-requests:write is granted.
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose token permissions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== token 对仓库的权限 ==="
          gh api "repos/${{ github.repository }}" --jq '.permissions' || true
          echo ""
          echo "=== 仓库的 workflow permissions 设置 ==="
          gh api "repos/${{ github.repository }}/actions/permissions/workflow" || true
          echo ""
          echo "=== token 能看到的 scopes ==="
          curl -sS -I -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}" \
            | grep -i "x-accepted-github-permissions\|x-oauth-scopes" || true
          echo ""
          echo "=== 直接用 API 试上传（不经过 gh）==="
          head -c 2000 preview_probe.png 2>/dev/null || \
            printf 'x' > probe.txt && \
          curl -sS -o /tmp/up.json -w "http_status=%{http_code}\n" \
            -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: image/png" \
            -H "Accept: application/vnd.github+json" \
            --data-binary @probe.txt \
            "https://uploads.github.com/user-attachments/assets" 2>&1 || true
          head -c 300 /tmp/up.json 2>/dev/null || true

      - name: Build
        run: npm run build

      - name: Render the example map
        run: |
          node --experimental-strip-types --no-warnings scripts/render-preview.ts \
            examples/v2-features.json preview.png

      - name: Upload as an artifact
        # Kept even though the comment carries the image: artifacts survive
        # comment edits and give a stable URL to link to later.
        uses: actions/upload-artifact@v5
        with:
          name: render-preview
          path: preview.png
          retention-days: 30

      - name: Post it on the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          short="${COMMIT_SHA:0:7}"

          # Invisible marker identifying this workflow's comment, so a re-run can
          # find and replace it. Without it every push would leave its own
          # screenshot behind and the pull request would collect a column of
          # images, all but the last one describing code that no longer exists.
          MARKER='<!-- jsmind-render-preview -->'

          # Unquoted heredoc delimiter so $short interpolates; backticks for
          # markdown are escaped so the shell does not treat them as commands.
          cat > /tmp/body.md <<BODY
          $MARKER
          ### Render preview

          \`examples/v2-features.json\` rendered at \`$short\` — 18 nodes, left and right balanced.

          This image is not an assertion. The tests prove the geometry is computed
          correctly; they cannot show whether the result looks like anything a person
          would want to read. That takes a glance, and that is what this is for.

          <sub>Generated by \`scripts/render-preview.ts\` from \`examples/v2-features.json\`</sub>
          BODY

          # Clear any previous preview first. Deleting before posting rather than
          # posting then deleting means a failed upload leaves the old image in
          # place instead of no image at all.
          previous=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" || true)
          for id in $previous; do
            echo "removing previous preview comment $id"
            gh api -X DELETE "repos/$REPO/issues/comments/$id" || true
          done

          # --attach uploads to GitHub's asset store and rewrites the markdown
          # reference, so the image renders inline. It needs push access; when the
          # repository withholds it, fall back to a link rather than fail.
          if gh pr comment "$PR_NUMBER" \
               --repo "$REPO" \
               --attach 'preview.png#jsMind render preview' \
               --body-file /tmp/body.md 2>/tmp/attach.err; then
            echo "posted with an inline image"
            exit 0
          fi

          echo "attach failed:"
          cat /tmp/attach.err

          {
            cat /tmp/body.md
            echo
            echo "**[View the image as an artifact](https://github.com/$REPO/actions/runs/$RUN_ID#artifacts)**"
            echo
            echo "<sub>Inline embedding needs \`GITHUB_TOKEN\` to have push access. "
            echo "Set via Settings → Actions → General → Workflow permissions.</sub>"
          } > /tmp/fallback.md

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/fallback.md
          echo "posted with an artifact link instead"
