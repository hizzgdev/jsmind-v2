# Publishes the public site to GitHub Pages: the landing page, the playground,
# and the VitePress documentation site under /docs/.
#
# `npm run assemble-site` writes `_site`. The documentation is built into
# `_site/docs` as part of that command. The landing page and playground stay
# at the site root.
name: Deploy static content to Pages

on:
  # Only on master: this is what the public sees, not a per-commit preview.
  push:
    branches: ["master"]

  # Allows running it from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Runs are queued rather than cancelled: cancelling a
# half-finished deployment of the live site is worse than waiting for it.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Build and deploy are separate jobs, and both reasons are about the artifact
# the deploy job reads back by name:
#
# - `actions/deploy-pages` resolves `github-pages` through the artifacts API a
#   fraction of a second after the upload finalizes when both steps share a
#   job. That list is eventually consistent, so the lookup intermittently
#   answers `Found 0 artifact(s)` for an artifact that does exist (see
#   actions/deploy-pages#451). A job boundary puts a runner allocation between
#   the upload and the lookup, which is why the official Pages starters split
#   them this way.
# - Re-running a failed deploy reuses the artifact that is already in the run.
#   Re-running a combined job uploads a second `github-pages` instead, and the
#   lookup then fails the other way, on a duplicate (actions/deploy-pages#338).
jobs:
  build:
    # Generous: npm ci on this repository takes a couple of minutes, and a
    # cancelled install leaves nothing useful behind anyway.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Matches ci.yml. The bundle only has to load in a browser, but a
          # second Node version across the repository is one more thing to
          # explain to whoever comes next.
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the library
        run: npm run build

      # `npm run assemble-site` writes `_site`: the landing page, the
      # playground, the bundle, and the VitePress docs site under `docs/`.
      # Path rewrite, the playground module-script check, and the docs
      # language redirect live in that command, not here.
      - name: Assemble the site
        run: npm run assemble-site

      # No actions/configure-pages step: it exists to configure Jekyll and Pages
      # settings for a build, and these files are already finished HTML.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    # No checkout, no Node, no build: the artifact is the only input, and
    # deploy-pages fetches it from this run itself.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # deploy-pages waits up to ten minutes for the deployment to go live; the
    # job budget is slightly larger so the action's own error is the one that
    # gets reported.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
