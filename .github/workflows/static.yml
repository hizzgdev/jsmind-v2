# Publishes the playground to GitHub Pages.
#
# The site is three files: a hand-written landing page, the playground, and the
# bundle it loads. No markdown is rendered here - the documentation stays on
# GitHub, where it can be searched, blamed and edited, and putting it on a static
# site would mean maintaining a markdown-to-HTML step that earns nothing.
name: Deploy static content to Pages

on:
  # Only on master: this is what the public sees, not a per-commit preview.
  push:
    branches: ["master"]

  # Allows running it from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Runs are queued rather than cancelled: cancelling a
# half-finished deployment of the live site is worse than waiting for it.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Generous: npm ci on this repository takes a couple of minutes, and a
    # cancelled install leaves nothing useful behind anyway.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Matches ci.yml. The bundle only has to load in a browser, but a
          # second Node version across the repository is one more thing to
          # explain to whoever comes next.
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the library
        run: npm run build

      # `npm run assemble-site` writes `_site`: the landing page, the
      # playground, and the bundle. Path rewrite and the check that the page
      # still loads the bundle live in that command, not here.
      - name: Assemble the site
        run: npm run assemble-site

      # No actions/configure-pages step: it exists to configure Jekyll and Pages
      # settings for a build, and these files are already finished HTML.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5