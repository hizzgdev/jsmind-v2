name: CI

on:
  # Push to master only: branches under review are covered by the
  # pull_request trigger below, so pushing a feature branch twice (once
  # before opening the PR, once after) does not burn two runs.
  push:
    branches: [master]
  pull_request:
    branches: [master]

# New pushes to the same branch cancel older runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, types, tests, build, preview
    runs-on: ubuntu-latest
    # Raised from 10: this job now also renders a preview, and the UI suite
    # alone can take a browser start or two on a slow runner.
    timeout-minutes: 15

    # The preview step needs both: pull-requests to comment, contents to upload
    # the image into the repository's asset store. Repositories whose Actions
    # settings leave "Workflow permissions" on the read-only default withhold
    # contents, and nothing in this file can raise it — the preview then falls
    # back to an artifact link instead of failing.
    permissions:
      contents: write
      pull-requests: write

    steps:
      # v7 runs on node24; v4 ran on node20, which GitHub deprecated.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # Deterministic install from the lockfile. This is npm's built-in
      # "npm ci", unrelated to the "ci" script in package.json.
      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format-check

      - name: Type check
        run: npm run type-check

      # Coverage runs here only. scripts.ci / ci2 and the pre-push hook stay on
      # test-lite / test on purpose: they are the manual and local paths, where
      # the full coverage report is slow and noisy. Thresholds live in
      # package.json (scripts.test:coverage).
      #
      # This runs the unit and data-layer suites only. The UI tests are a
      # separate command further down, because they need the built bundle.
      - name: Tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Separate, on purpose: these drive a real browser against dist/jsmind.js
      # rather than the TypeScript sources, so they need the build above. Kept
      # out of test / test:coverage so that suite stays fast and needs no
      # browser, and so the manual packages (`npm run ci`) keep their order.
      - name: UI tests
        # A stalled browser start used to consume the whole job timeout; fail
        # this step on its own budget instead so the cause is obvious.
        timeout-minutes: 3
        run: npm run test:ui

      # ---------------------------------------------------------------------
      # Render preview
      #
      # Not a nicety. The tests prove the geometry is computed correctly and
      # cannot show whether the result looks like anything — that takes an
      # image someone can open. So it belongs in the same pipeline as the
      # assertions, and a failure here is a failure like any other.
      #
      # Pull requests only: a push to master has no comment to post into.
      # ---------------------------------------------------------------------

      - name: Render the example map
        if: github.event_name == 'pull_request'
        run: |
          node --experimental-strip-types --no-warnings scripts/render-preview.ts \
            examples/v2-features.json preview.png

      # The comment embeds this image with markdown, which needs a URL GitHub
      # serves as an image. Neither artifacts nor release assets qualify:
      # artifact URLs need auth and redirect to HTML, and release download URLs
      # arrive as `application/octet-stream` with `Content-Disposition:
      # attachment`, so GitHub treats them as a file to fetch rather than a
      # picture to draw. A file on a branch is served by
      # raw.githubusercontent.com as `image/png` — the one form that works, and
      # what reg-actions and awesome-copilot both document.
      #
      # Force-pushed so the branch holds exactly one file and no history. Done in
      # a scratch directory so the checked-out tree is never disturbed.
      - name: Publish the image to the preview branch
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          rm -rf /tmp/preview-branch && mkdir -p /tmp/preview-branch
          cp preview.png /tmp/preview-branch/preview.png
          cd /tmp/preview-branch
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview.png
          git commit -q -m "preview: ${SHA:0:7}"
          git push -q -f \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            HEAD:render-preview
          echo "published ${SHA:0:7} to the render-preview branch"

      - name: Upload the preview
        id: preview
        if: github.event_name == 'pull_request'
        # v7 with `archive: false`, not v5. Uploading unzipped means the browser
        # opens the PNG directly instead of handing over a zip — which is the
        # whole point of the link in the comment below. Older versions and the
        # default `archive: true` still zip, by design, for backwards
        # compatibility.
        uses: actions/upload-artifact@v7
        with:
          name: render-preview
          path: preview.png
          archive: false
          retention-days: 30

      - name: Post it on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          short="${COMMIT_SHA:0:7}"

          # Invisible marker so a re-run can find and replace this comment.
          # Without it every push would leave its own screenshot behind and the
          # pull request would collect a column of images, all but the last
          # describing code that no longer exists.
          MARKER='<!-- jsmind-render-preview -->'

          # Unquoted heredoc delimiter so $short interpolates; backticks are
          # escaped so the shell does not run them as commands.
          cat > /tmp/body.md <<BODY
          $MARKER
          ### Render preview

          ![jsMind render preview](https://raw.githubusercontent.com/$REPO/render-preview/preview.png?v=$short)

          \`examples/v2-features.json\` rendered at \`$short\` — 18 nodes, left and right balanced.

          This image is not an assertion. The tests prove the geometry is computed
          correctly; they cannot show whether the result looks like anything a person
          would want to read. That takes a glance, and that is what this is for.

          <sub>Generated by \`scripts/render-preview.ts\`, pushed to the \`render-preview\`
          branch by this run. The \`?v=\` suffix busts the CDN cache so a re-render shows
          up right away.</sub>
          BODY

          # Clear any previous preview first. Deleting before posting means a
          # failure leaves the old image in place instead of no image at all.
          previous=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" || true)
          for id in $previous; do
            echo "removing previous preview comment $id"
            gh api -X DELETE "repos/$REPO/issues/comments/$id" || true
          done

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/body.md
          echo "posted"
