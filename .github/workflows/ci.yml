name: CI

on:
  # Push to master only: branches under review are covered by the
  # pull_request trigger below, so pushing a feature branch twice (once
  # before opening the PR, once after) does not burn two runs.
  push:
    branches: [master]
  pull_request:
    branches: [master]

# New pushes to the same branch cancel older runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Everything that does not need a browser.
  # ---------------------------------------------------------------------------
  checks:
    name: Format, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Read-only on purpose: nothing here writes to the repository, so nothing
    # here should be able to.
    permissions:
      contents: read

    steps:
      # v7 runs on node24; v4 ran on node20, which GitHub deprecated.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # Deterministic install from the lockfile. This is npm's built-in
      # "npm ci", unrelated to the "ci" script in package.json.
      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format-check

      - name: Type check
        run: npm run type-check

      # Unit and data-layer suites only. The UI tests live in the job below,
      # because they drive a real browser against the built bundle.
      #
      # Coverage runs here and nowhere else. scripts.ci / ci2 and the pre-push
      # hook stay on test-lite / test on purpose: they are the manual and local
      # paths, where the full coverage report is slow and noisy. Thresholds live
      # in package.json (scripts.test:coverage).
      - name: Tests with coverage
        run: npm run test:coverage

      # The ui job builds again on its own rather than depending on this one and
      # downloading dist/ as an artifact. That round trip costs more than the
      # roughly three seconds a build takes — see the note there before adding
      # a `needs:` between the jobs.
      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Everything that needs a browser, in the order it needs them:
  # build -> UI tests -> render.
  # ---------------------------------------------------------------------------
  ui:
    name: Build, UI tests, render preview
    runs-on: ubuntu-latest
    # Generous: the browser starts twice here (UI suite, then the preview
    # render), and a stalled start used to eat the whole budget silently.
    timeout-minutes: 15

    # The preview publishes an image to a branch and comments on the PR. Both
    # are writes; the checks job above deliberately does not get them.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Separate job, so it needs its own build. Passing dist/ between jobs
      # would mean an upload and a download - slower than the ~3 seconds this
      # takes.
      - name: Build
        run: npm run build

      # These drive a real browser against dist/jsmind.js rather than the
      # TypeScript sources, which is why they need the build above. Kept out of
      # test / test:coverage so that suite stays fast and needs no browser, and
      # so the manual packages (`npm run ci`) keep their order.
      - name: UI tests
        # A stalled browser start used to consume the whole job timeout; fail
        # this step on its own budget instead so the cause is obvious.
        timeout-minutes: 3
        run: npm run test:ui

      # -----------------------------------------------------------------------
      # Render preview
      #
      # Not a nicety. The tests prove the geometry is computed correctly and
      # cannot show whether the result looks like anything - that takes an
      # image someone can open. So it runs after the assertions, and a failure
      # here is a failure like any other.
      #
      # Pull requests only: a push to master has no comment to post into.
      # -----------------------------------------------------------------------

      - name: Render the example map
        if: github.event_name == 'pull_request'
        run: |
          node --experimental-strip-types --no-warnings scripts/render-preview.ts \
            examples/v2-features.json tmp/preview.png

      # The image goes up as a comment attachment, in two steps with different
      # tokens.
      #
      # Step one uploads to https://uploads.github.com/user-attachments/assets,
      # the endpoint gh's own `--attach` posts to, and gets back
      # https://github.com/user-attachments/assets/<uuid>. That URL names a blob,
      # not a commit, so rebases and force-pushes leave it alone - unlike the
      # render-preview branch it replaces, where each push renamed the file and
      # orphaned every earlier comment's image.
      #
      # Step two posts the comment with GITHUB_TOKEN, so it is attributed to
      # github-actions[bot] like every other CI comment on the pull request. Using
      # `--attach` would have done both in one command but under a single
      # credential, and there is no way to say "upload as the maintainer, post as
      # the bot" to a command that only takes one token.
      #
      # Hence two secrets doing different jobs: PR_PREVIEW_TOKEN owns the upload,
      # GITHUB_TOKEN owns the comment.
      #
      # Forks never receive repository secrets, so the upload step warns and
      # stops rather than failing the build: the point of this job is the tests,
      # and the picture is a courtesy.
      - name: Upload the preview
        id: upload
        if: github.event_name == 'pull_request'
        env:
          # Two credentials in one step, doing different jobs.
          #
          # GH_TOKEN is the bot's, and only reads the numeric repository id;
          # it makes no writes. gh refuses to run in Actions without it even
          # for a plain `gh api` read, which is how this step first failed.
          #
          # UPLOAD_TOKEN is a maintainer's, and only performs the upload. The
          # endpoint rejects installation tokens with "attaching files requires
          # write access to the repository" - a statement about the kind of
          # credential, not about the permissions block above.
          GH_TOKEN: ${{ github.token }}
          UPLOAD_TOKEN: ${{ secrets.PR_PREVIEW_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${UPLOAD_TOKEN:-}" ]; then
            echo "::warning::PR_PREVIEW_TOKEN is not set; skipping the preview comment."
            echo "::warning::Set it to a token with write access to $REPO, or forks never get a preview."
            exit 0
          fi

          repo_id=$(gh api "repos/$REPO" --jq .id)

          # --data-binary, not --data: the latter mangles the payload. The query
          # string is what the endpoint reads for the content type, so it has to
          # survive URL encoding unchanged.
          response=$(curl -sS -X POST \
            "https://uploads.github.com/user-attachments/assets?content_type=image%2Fpng&name=preview.png&repository_id=$repo_id" \
            -H "Authorization: Bearer $UPLOAD_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @tmp/preview.png)

          url=$(printf '%s' "$response" | jq -r '.url // empty')
          if [ -z "$url" ]; then
            echo "::error::Upload failed: $response"
            exit 1
          fi

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "uploaded $(du -h tmp/preview.png | cut -f1) to $url"

      # Posts the comment, attributed to github-actions[bot].
      - name: Post it on the pull request
        if: github.event_name == 'pull_request' && steps.upload.outputs.url != ''
        env:
          # github.token rather than secrets.GITHUB_TOKEN: same credential,
          # but present in every context and impossible to shadow with a secret.
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # One variable, two uses: the full sha names the commit in the prose,
          # the first seven characters keep it readable.
          FULL_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          short="${FULL_SHA:0:7}"

          # Invisible marker so a re-run can find and replace this comment.
          # Without it every push would leave its own screenshot behind and the
          # pull request would collect a column of images, all but the last
          # describing code that no longer exists.
          MARKER='<!-- jsmind-render-preview -->'

          # Clear any previous preview first. Deleting before posting means a
          # failure leaves the old image in place instead of no image at all.
          previous=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" || true)
          for id in $previous; do
            echo "removing previous preview comment $id"
            gh api -X DELETE "repos/$REPO/issues/comments/$id" || true
          done

          # Unquoted heredoc delimiter so the variables interpolate; backticks
          # are escaped so the shell does not run them as commands.
          cat > tmp/comment.md <<BODY
          $MARKER
          ### Render preview

          ![jsMind render preview]($PREVIEW_URL)

          Rendered from the latest code on this branch, at \`$short\`.

          **Worth a look for anything odd** - overlapping nodes, missing edges, text
          spilling outside its box, a lopsided layout. The tests check that the
          geometry is computed correctly; whether it actually *looks* right is the one
          thing they cannot tell you, and the one thing this image is for.

          [Workflow run](https://github.com/$REPO/actions/runs/$RUN_ID)
          <sub>Generated by \`scripts/render-preview.ts\` from \`examples/v2-features.json\`,
          pinned to this commit. Uploaded as a comment attachment, so it stays viewable
          for as long as this comment exists.</sub>
          BODY

          gh pr comment "$PR_NUMBER" \
            --repo "$REPO" \
            --body-file tmp/comment.md
