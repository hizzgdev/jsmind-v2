name: CI

on:
  # Push to master only: branches under review are covered by the
  # pull_request trigger below, so pushing a feature branch twice (once
  # before opening the PR, once after) does not burn two runs.
  push:
    branches: [master]
  pull_request:
    branches: [master]

# New pushes to the same branch cancel older runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, types, tests, build, preview
    runs-on: ubuntu-latest
    # Raised from 10: this job now also renders a preview, and the UI suite
    # alone can take a browser start or two on a slow runner.
    timeout-minutes: 15

    # The preview step needs both: pull-requests to comment, contents to upload
    # the image into the repository's asset store. Repositories whose Actions
    # settings leave "Workflow permissions" on the read-only default withhold
    # contents, and nothing in this file can raise it — the preview then falls
    # back to an artifact link instead of failing.
    permissions:
      contents: write
      pull-requests: write

    steps:
      # v7 runs on node24; v4 ran on node20, which GitHub deprecated.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # Deterministic install from the lockfile. This is npm's built-in
      # "npm ci", unrelated to the "ci" script in package.json.
      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format-check

      - name: Type check
        run: npm run type-check

      # Coverage runs here only. scripts.ci / ci2 and the pre-push hook stay on
      # test-lite / test on purpose: they are the manual and local paths, where
      # the full coverage report is slow and noisy. Thresholds live in
      # package.json (scripts.test:coverage).
      #
      # This runs the unit and data-layer suites only. The UI tests are a
      # separate command further down, because they need the built bundle.
      - name: Tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Separate, on purpose: these drive a real browser against dist/jsmind.js
      # rather than the TypeScript sources, so they need the build above. Kept
      # out of test / test:coverage so that suite stays fast and needs no
      # browser, and so the manual packages (`npm run ci`) keep their order.
      - name: UI tests
        # A stalled browser start used to consume the whole job timeout; fail
        # this step on its own budget instead so the cause is obvious.
        timeout-minutes: 3
        run: npm run test:ui

      # ---------------------------------------------------------------------
      # Render preview
      #
      # Not a nicety. The tests prove the geometry is computed correctly and
      # cannot show whether the result looks like anything — that takes an
      # image someone can open. So it belongs in the same pipeline as the
      # assertions, and a failure here is a failure like any other.
      #
      # Pull requests only: a push to master has no comment to post into.
      # ---------------------------------------------------------------------

      - name: Render the example map
        if: github.event_name == 'pull_request'
        run: |
          node --experimental-strip-types --no-warnings scripts/render-preview.ts \
            examples/v2-features.json preview.png

      - name: Upload the preview
        id: preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: render-preview
          path: preview.png
          retention-days: 30

      - name: Post it on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.preview.outputs.artifact-id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          short="${COMMIT_SHA:0:7}"

          # Invisible marker identifying this workflow's comment, so a re-run can
          # find and replace it. Without it every push would leave its own
          # screenshot behind and the pull request would collect a column of
          # images, all but the last describing code that no longer exists.
          MARKER='<!-- jsmind-render-preview -->'

          # Unquoted heredoc delimiter so $short interpolates; backticks for
          # markdown are escaped so the shell does not treat them as commands.
          cat > /tmp/body.md <<BODY
          $MARKER
          ### Render preview

          \`examples/v2-features.json\` rendered at \`$short\` — 18 nodes, left and right balanced.

          This image is not an assertion. The tests prove the geometry is computed
          correctly; they cannot show whether the result looks like anything a person
          would want to read. That takes a glance, and that is what this is for.

          <sub>Generated by \`scripts/render-preview.ts\` from \`examples/v2-features.json\`</sub>
          BODY

          # Clear any previous preview first. Deleting before posting rather than
          # posting then deleting means a failed upload leaves the old image in
          # place instead of no image at all.
          previous=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" || true)
          for id in $previous; do
            echo "removing previous preview comment $id"
            gh api -X DELETE "repos/$REPO/issues/comments/$id" || true
          done

          # --attach uploads to GitHub's asset store and rewrites the markdown
          # reference, so the image renders inline. It needs push access; when the
          # repository withholds it, fall back to a link rather than fail.
          if gh pr comment "$PR_NUMBER" \
               --repo "$REPO" \
               --attach 'preview.png#jsMind render preview' \
               --body-file /tmp/body.md 2>/tmp/attach.err; then
            echo "posted with an inline image"
            exit 0
          fi

          echo "attach failed:"
          cat /tmp/attach.err

          {
            cat /tmp/body.md
            echo
            echo "**[Open the image](https://github.com/$REPO/actions/runs/$RUN_ID/artifacts/$ARTIFACT_ID)**"
            echo
            echo "GitHub serves artifacts as a zip containing this one PNG. To pull it locally:"
            echo
            echo '```sh'
            echo "gh run download $RUN_ID --repo $REPO -n render-preview"
            echo '```'
            echo
            echo "<sub>Inline embedding needs \`GITHUB_TOKEN\` to have \`contents: write\`. "
            echo "Repositories whose Actions settings use the read-only default withhold it, "
            echo "and a workflow cannot grant it for itself — "
            echo "Settings → Actions → General → Workflow permissions → Read and write changes that.</sub>"
          } > /tmp/fallback.md

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/fallback.md
          echo "posted with an artifact link instead"