name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

# New pushes to the same branch cancel older runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format-check

      - name: Type check
        run: npm run type-check

      # Thresholds live in package.json (test:coverage) so the local pre-push
      # hook and CI enforce exactly the same numbers.
      # Current baseline: 97.1% lines / 95.7% branches / 93.9% functions.
      - name: Tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build