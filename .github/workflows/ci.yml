name: CI

on:
  # Push to master only: branches under review are covered by the
  # pull_request trigger below, so pushing a feature branch twice (once
  # before opening the PR, once after) does not burn two runs.
  push:
    branches: [master]
  pull_request:
    branches: [master]

# New pushes to the same branch cancel older runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Everything that does not need a browser.
  # ---------------------------------------------------------------------------
  checks:
    name: Format, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Read-only on purpose: nothing here writes to the repository, so nothing
    # here should be able to.
    permissions:
      contents: read

    steps:
      # v7 runs on node24; v4 ran on node20, which GitHub deprecated.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # Deterministic install from the lockfile. This is npm's built-in
      # "npm ci", unrelated to the "ci" script in package.json.
      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format-check

      - name: Type check
        run: npm run type-check

      # Unit and data-layer suites only. The UI tests live in the job below,
      # because they drive a real browser against the built bundle.
      #
      # Coverage runs here and nowhere else. scripts.ci / ci2 and the pre-push
      # hook stay on test-lite / test on purpose: they are the manual and local
      # paths, where the full coverage report is slow and noisy. Thresholds live
      # in package.json (scripts.test:coverage).
      - name: Tests with coverage
        run: npm run test:coverage

      # The ui job builds again on its own rather than depending on this one and
      # downloading dist/ as an artifact. That round trip costs more than the
      # roughly three seconds a build takes — see the note there before adding
      # a `needs:` between the jobs.
      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Everything that needs a browser, in the order it needs them:
  # build -> UI tests -> render.
  # ---------------------------------------------------------------------------
  ui:
    name: Build, UI tests, render preview
    runs-on: ubuntu-latest
    # Generous: the browser starts twice here (UI suite, then the preview
    # render), and a stalled start used to eat the whole budget silently.
    timeout-minutes: 15

    # The preview publishes an image to a branch and comments on the PR. Both
    # are writes; the checks job above deliberately does not get them.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Separate job, so it needs its own build. Passing dist/ between jobs
      # would mean an upload and a download - slower than the ~3 seconds this
      # takes.
      - name: Build
        run: npm run build

      # These drive a real browser against dist/jsmind.js rather than the
      # TypeScript sources, which is why they need the build above. Kept out of
      # test / test:coverage so that suite stays fast and needs no browser, and
      # so the manual packages (`npm run ci`) keep their order.
      - name: UI tests
        # A stalled browser start used to consume the whole job timeout; fail
        # this step on its own budget instead so the cause is obvious.
        timeout-minutes: 3
        run: npm run test:ui

      # -----------------------------------------------------------------------
      # Render preview
      #
      # Not a nicety. The tests prove the geometry is computed correctly and
      # cannot show whether the result looks like anything - that takes an
      # image someone can open. So it runs after the assertions, and a failure
      # here is a failure like any other.
      #
      # Pull requests only: a push to master has no comment to post into.
      # -----------------------------------------------------------------------

      - name: Render preview
        # Pull requests only: a push to master has no comment to post into.
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/render-preview
        with:
          repo: ${{ github.repository }}
          pr-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          # Forks never receive repository secrets, so the upload warns and
          # stops inside the action rather than failing the build: the point
          # of this job is the tests, and the picture is a courtesy.
          upload-token: ${{ secrets.PR_PREVIEW_TOKEN }}
