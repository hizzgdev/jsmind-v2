name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

# New pushes to the same branch cancel older runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Deterministic install from the lockfile. This is npm's built-in
      # "npm ci", unrelated to the "ci" script in package.json.
      - name: Install dependencies
        run: npm ci

      # The pipeline itself lives in package.json (scripts.ci) so that CI, the
      # pre-push hook and a manual run cannot drift apart. Coverage thresholds
      # are part of that script.
      - name: Run checks
        run: npm run ci
