name: CI

on:
  # Push to master only: branches under review are covered by the
  # pull_request trigger below, so pushing a feature branch twice (once
  # before opening the PR, once after) does not burn two runs.
  push:
    branches: [master]
  # Any PR base, not just master, so a stacked docs PR (for example one
  # whose base is this branch) still gets CI checks. Pages deploy in
  # static.yml remains master-only.
  pull_request:

# New pushes to the same branch cancel older runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Decides what the other jobs are worth running.
  #
  # Almost every change here touches documentation - this repository has more
  # prose than code, and a plan or a decision record is edited far more often
  # than the renderer. Rendering an image for those runs costs a browser
  # install, a build and a vision call's worth of context to look at, and
  # produces a picture identical to the one already on the pull request.
  #
  # Deliberately not `paths:` on the trigger: that skips the whole workflow,
  # and a documentation-only change still needs its formatting checked.
  # ---------------------------------------------------------------------------
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    outputs:
      # 'true' when something that can change the rendered image moved.
      render: ${{ steps.paths.outputs.render }}
      # 'true' when every changed file is under docs/. File type (markdown,
      # VitePress config, ts/js/vue, ...) is not classified here.
      docs_only: ${{ steps.paths.outputs.docs_only }}
      # 'true' when at least one changed file is under docs/. The docs site
      # job uses this to decide whether to run; it then looks at which
      # docs files moved.
      docs: ${{ steps.paths.outputs.docs }}
      # 'true' when a non-markdown file outside docs/ changed, so the
      # library type-check, unit tests, build and UI tests should run.
      # Root README and other *.md files are prose: they do not set this,
      # and they also do not run or skip the docs site job.
      library: ${{ steps.paths.outputs.library }}
      # 'true' when the published front page could have changed. The site root
      # is rendered from the root README.md during assembly, so a prose-only
      # edit there still needs the landing-page tests - none of the other jobs
      # would run for it. Only the root README: README.zh.md and other markdown
      # are not rendered into the site.
      landing: ${{ steps.paths.outputs.landing }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The diff needs the base commit, which may be many commits back.
          # Cheap here - the repository is a few megabytes.
          fetch-depth: 0

      - name: Compare against the base
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE...$PR_HEAD"
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$PUSH_BEFORE...$PUSH_AFTER"
          else
            # First push to a new branch: no before-commit to diff against.
            # Assume the worst rather than silently skipping the render.
            echo "no usable base commit; running every check"
            echo "render=true" >> "$GITHUB_OUTPUT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "library=true" >> "$GITHUB_OUTPUT"
            echo "landing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! changed=$(git diff --name-only "$range"); then
            echo "::warning::could not diff $range; running every check"
            echo "render=true" >> "$GITHUB_OUTPUT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "library=true" >> "$GITHUB_OUTPUT"
            echo "landing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Independent questions, answered in one pass over the file list.
          #
          # render: can this change the picture? Paths whose contents feed the
          #   renderer. example/ is listed whole rather than just the fixture it
          #   renders: moving or renaming the fixture would break the preview,
          #   and the run that breaks it should be the run that shows it.
          #
          # docs_only: is every changed file under docs/? This layer does not
          #   subdivide docs/ by .vitepress, markdown, or ts/js/vue.
          #
          # docs: did anything under docs/ change? The docs site job runs when
          #   this is true, and then decides which checks to perform.
          #
          # library: did a non-markdown file outside docs/ change? Root README
          #   and other *.md files are prose: they do not require library
          #   checks, and they do not run or skip the docs site job.
          #
          # landing: did the root README.md change? It is the only source of
          #   the landing page, which is rendered into the site root during
          #   assembly. A prose edit there is the one way to break that page,
          #   and it is invisible to every other flag, so it gets its own.
          #
          # These answers are not complements: a change only under docs/ is
          # docs_only and docs, not library; a README-only change is none of
          # docs_only, docs, or library, but it is landing; a change to
          # .github/workflows/static.yml is library but not docs; a change
          # to src/ is both library and render.
          render=false
          docs_only=true
          docs=false
          library=false
          landing=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue

            case "$file" in
              src/*|example/*|package.json|package-lock.json|tsconfig.json)
                render=true; echo "affects the render: $file" ;;
              .github/actions/render-map/*|.github/workflows/ci.yml)
                render=true; echo "affects the render: $file" ;;
            esac

            case "$file" in
              docs/*)
                docs=true
                echo "docs change: $file"
                ;;
              *)
                docs_only=false
                case "$file" in
                  *.md)
                    # README.md is not just prose here: it is rendered into
                    # the published front page. README.zh.md is not.
                    if [ "$file" = "README.md" ]; then
                      landing=true
                    fi
                    echo "prose: $file"
                    ;;
                  *)
                    library=true
                    echo "library checks needed: $file"
                    ;;
                esac
                ;;
            esac
          done <<< "$changed"

          # No files at all is not "only documentation" - an empty diff means
          # the comparison itself failed to produce anything, and the library
          # checks should run rather than be skipped on a technicality.
          if [ -z "$changed" ]; then
            docs_only=false
            library=true
            landing=true
            echo "empty diff; running the library checks"
          fi

          echo "render=$render" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "library=$library" >> "$GITHUB_OUTPUT"
          echo "landing=$landing" >> "$GITHUB_OUTPUT"

          if [ "$render" = "false" ]; then
            echo "nothing here can change the image; skipping the render"
          fi
          if [ "$library" = "false" ]; then
            echo "no library source changed; skipping type-check, unit tests, build and UI tests"
          fi
          if [ "$landing" = "true" ]; then
            echo "README.md changed; the landing-page tests will run"
          fi
          if [ "$docs" = "true" ]; then
            echo "docs/ changed; the docs site job will decide which checks to run"
          fi
          if [ "$docs_only" = "true" ]; then
            echo "all changes are under docs/"
          fi

  # ---------------------------------------------------------------------------
  # Everything that does not need a browser.
  #
  # Red here means the code is wrong: format, types, unit tests or the build.
  # Browsers are deliberately kept out so that stays true - a CI failure in this
  # job is never "the runner had a bad day".
  # ---------------------------------------------------------------------------
  checks:
    name: Format, types, tests, build
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Read-only on purpose: nothing here writes to the repository, so nothing
    # here should be able to.
    permissions:
      contents: read

    steps:
      # v7 runs on node24; v4 ran on node20, which GitHub deprecated.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # Deterministic install from the lockfile. This is npm's built-in
      # "npm ci", unrelated to the "ci" script in package.json.
      #
      # Runs even for documentation-only changes: prettier is a dependency, so
      # the format check below cannot work without it.
      - name: Install dependencies
        run: npm ci

      # The one step a documentation-only change actually needs. Markdown has
      # line width and list formatting rules like any other file, and they are
      # worth failing on.
      - name: Format check
        run: npm run format-check

      # Everything below compiles or exercises the TypeScript library sources.
      # Changes that only touch docs/ or other markdown cannot change those
      # answers, so these steps are skipped. Docs-site checks live in the
      # docs-site job, not here.
      - name: Type check
        if: needs.changes.outputs.library == 'true'
        run: npm run type-check

      # The landing page is rendered from the root README.md at assembly time,
      # so a README edit alone can publish broken HTML to the front page - and
      # a README edit alone runs none of the steps around this one. The pages
      # site tests hold the guard for that; --test-name-pattern picks the
      # landing-page cases so a prose fix does not pay for the VitePress build
      # in the same file. The docs-site job runs the whole file when docs/
      # changed, and the coverage suite covers it for a library change.
      - name: Landing page tests
        if: needs.changes.outputs.landing == 'true'
        run: node --test --test-name-pattern='landing page' __tests__/build/pages-site.test.ts

      # Unit and data-layer suites only. The UI tests live in the job below,
      # because they drive a real browser against the built bundle.
      #
      # Coverage runs here and nowhere else. scripts.ci / ci2 and the pre-push
      # hook stay on test-lite / test on purpose: they are the manual and local
      # paths, where the full coverage report is slow and noisy. Thresholds live
      # in package.json (scripts.test:coverage).
      - name: Tests with coverage
        if: needs.changes.outputs.library == 'true'
        run: npm run test:coverage

      # The ui job builds again on its own rather than depending on this one and
      # downloading dist/ as an artifact. That round trip costs more than the
      # roughly three seconds a build takes — see the note there before adding
      # a `needs:` between the jobs.
      - name: Build
        if: needs.changes.outputs.library == 'true'
        run: npm run build


  # ---------------------------------------------------------------------------
  # Docs site. Runs when anything under docs/ changed. It does not repeat the
  # library type-check, coverage tests, or UI tests.
  #
  # This job looks at which docs files moved, then decides whether the
  # published VitePress site could have changed. docs/architecture/,
  # docs/features/, docs/requirements/, docs/images/, and docs/README.md
  # are excluded from the site. Changes under docs/.vitepress/ or any
  # non-markdown file in docs/ always run the site checks, as do changes
  # to the published en/ and zh/ trees.
  # ---------------------------------------------------------------------------
  docs-site:
    name: Docs site
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The decision step diffs against the base commit.
          fetch-depth: 0

      - name: Decide whether the docs site is affected
        id: site
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          affected=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE...$PR_HEAD"
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$PUSH_BEFORE...$PUSH_AFTER"
          else
            echo "no usable base commit; running the docs site checks"
            echo "affected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! changed=$(git diff --name-only "$range"); then
            echo "::warning::could not diff $range; running the docs site checks"
            echo "affected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$changed" ]; then
            echo "empty diff; running the docs site checks"
            echo "affected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          affected=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docs/.vitepress/*)
                affected=true
                echo "docs site must be checked (vitepress): $file"
                ;;
              docs/architecture/*|docs/features/*|docs/requirements/*|docs/images/*|docs/README.md)
                echo "excluded from the docs site: $file"
                ;;
              docs/*)
                case "$file" in
                  *.md)
                    affected=true
                    echo "docs site content: $file"
                    ;;
                  *)
                    affected=true
                    echo "docs site must be checked (non-markdown): $file"
                    ;;
                esac
                ;;
            esac
          done <<< "$changed"

          echo "affected=$affected" >> "$GITHUB_OUTPUT"
          if [ "$affected" = "true" ]; then
            echo "the published docs site may have changed; running assemble-site / pages-site tests"
          else
            echo "docs/ changed, but the published site is not affected; skipping site checks"
          fi

      - name: Setup Node
        if: steps.site.outputs.affected == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        if: steps.site.outputs.affected == 'true'
        run: npm ci

      # The pages-site tests call assembleDocsSite (VitePress into _site/docs)
      # and the root-file fixture. That is the assemble-site / pages-site
      # check without rebuilding the library bundle.
      - name: Assemble and test the docs site
        if: steps.site.outputs.affected == 'true'
        run: node --test __tests__/build/pages-site.test.ts

  # ---------------------------------------------------------------------------
  # Needs a browser. Runs when the library may have changed, not when the
  # only changes are under docs/ or other markdown.
  #
  # These load dist/jsmind.js and drive it in a real browser. Documentation
  # is not compiled into that bundle, so a docs-only change would re-assert
  # yesterday's result against the same bytes. Docs-site checks are in the
  # docs-site job.
  # ---------------------------------------------------------------------------
  ui:
    name: UI tests
    needs: changes
    if: needs.changes.outputs.library == 'true'
    runs-on: ubuntu-latest
    # Generous: a stalled browser start used to eat the whole budget silently.
    timeout-minutes: 10

    # Read-only: the tests assert, they do not publish.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Separate job, so it needs its own build. Passing dist/ between jobs
      # would mean an upload and a download - slower than the ~3 seconds this
      # takes.
      - name: Build
        run: npm run build

      # These drive a real browser against dist/jsmind.js rather than the
      # TypeScript sources, which is why they need the build above. Kept out of
      # test / test:coverage so that suite stays fast and needs no browser, and
      # so the manual packages (`npm run ci`) keep their order.
      - name: UI tests
        # A stalled browser start used to consume the whole job timeout; fail
        # this step on its own budget instead so the cause is obvious.
        timeout-minutes: 3
        run: npm run test:ui

  # ---------------------------------------------------------------------------
  # Render preview
  #
  # Pull requests only, and only those that changed something the renderer
  # reads. Two conditions rather than one, and both belong on the job: a push
  # to master has no comment to post into, and a documentation-only pull
  # request has nothing new to render.
  #
  # Not a nicety. The tests prove the geometry is computed correctly and cannot
  # show whether the result looks like anything - that takes an image someone can
  # open.
  #
  # Separate from the UI tests even though both need a browser: those are
  # assertions that must run on every commit, this produces an artifact and
  # spends a token. Sharing an environment is not sharing a purpose.
  # ---------------------------------------------------------------------------
  preview:
    name: Render preview
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.render == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Both steps publish: one uploads an image, one comments. Writes are
    # confined to this job.
    permissions:
      contents: read
      pull-requests: write

    steps:
      # v7 runs on node24; v4 ran on node20, which GitHub deprecated.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Its own build: passing dist/ between jobs would mean an upload and a
      # download, slower than the ~3 seconds this takes.
      - name: Build
        run: npm run build

      - name: Render
        uses: ./.github/actions/render-map
        with:
          data-file: example/v2-features.json
          output: tmp/preview.png

      # The image goes up as a comment attachment, in two steps with different
      # tokens.
      #
      # Step one uploads to https://uploads.github.com/user-attachments/assets,
      # the endpoint gh's own --attach posts to, and gets back
      # https://github.com/user-attachments/assets/<uuid>. That URL names a blob,
      # not a commit, so rebases and force-pushes leave it alone - unlike the
      # render-preview branch it replaces, where each push renamed the file and
      # orphaned every earlier comment's image.
      #
      # Step two posts the comment with github.token, so it is attributed to
      # github-actions[bot] like every other CI comment. Using --attach would have
      # done both in one command but under a single credential, and there is no
      # way to say "upload as the maintainer, post as the bot" to a command that
      # only takes one token.
      #
      # Forks never receive repository secrets, so the upload warns and stops
      # rather than failing: the point of CI here is the tests, and the picture
      # is a courtesy.
      - name: Upload the preview
        id: upload
        env:
          # Two credentials in one step, doing different jobs.
          #
          # GH_TOKEN is the bot's, and only reads the numeric repository id; it
          # makes no writes. gh refuses to run in Actions without it even for a
          # plain `gh api` read.
          #
          # UPLOAD_TOKEN is a maintainer's, and only performs the upload. The
          # endpoint rejects installation tokens with "attaching files requires
          # write access to the repository" - a statement about the kind of
          # credential, not about the permissions block above.
          GH_TOKEN: ${{ github.token }}
          UPLOAD_TOKEN: ${{ secrets.PR_PREVIEW_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${UPLOAD_TOKEN:-}" ]; then
            echo "::warning::PR_PREVIEW_TOKEN is not set; skipping the preview comment."
            echo "::warning::Set it to a token with write access to $REPO, or forks never get a preview."
            exit 0
          fi

          repo_id=$(gh api "repos/$REPO" --jq .id)

          # --data-binary, not --data: the latter mangles the payload. The query
          # string is what the endpoint reads for the content type, so it has to
          # survive URL encoding unchanged.
          response=$(curl -sS -X POST \
            "https://uploads.github.com/user-attachments/assets?content_type=image%2Fpng&name=preview.png&repository_id=$repo_id" \
            -H "Authorization: Bearer $UPLOAD_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @tmp/preview.png)

          url=$(printf '%s' "$response" | jq -r '.url // empty')
          if [ -z "$url" ]; then
            echo "::error::Upload failed: $response"
            exit 1
          fi

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "uploaded $(du -h tmp/preview.png | cut -f1) to $url"

      - name: Post it on the pull request
        if: steps.upload.outputs.url != ''
        env:
          # github.token rather than secrets.GITHUB_TOKEN: same credential, but
          # present in every context and impossible to shadow with a secret.
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # One variable, two uses: the full sha names the commit in the prose,
          # the first seven characters keep it readable.
          FULL_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          short="${FULL_SHA:0:7}"

          # Invisible marker so a re-run can find and replace this comment.
          # Without it every push would leave its own screenshot behind and the
          # pull request would collect a column of images, all but the last
          # describing code that no longer exists.
          MARKER='<!-- jsmind-render-preview -->'

          # Clear any previous preview first. Deleting before posting means a
          # failure leaves the old image in place instead of no image at all.
          previous=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" || true)
          for id in $previous; do
            echo "removing previous preview comment $id"
            gh api -X DELETE "repos/$REPO/issues/comments/$id" || true
          done

          # Unquoted heredoc delimiter so the variables interpolate; backticks
          # are escaped so the shell does not run them as commands.
          #
          # Every paragraph below is one long line on purpose. GitHub renders
          # comments with breaks:true, so a single newline becomes a <br> -
          # wrapping a sentence to fit the source column posts it as a stack of
          # short lines instead of the paragraph it reads as here.
          cat > tmp/comment.md <<BODY
          $MARKER
          ### Render preview

          ![jsMind render preview]($PREVIEW_URL)

          Rendered from the latest code on this branch, at \`$short\`.

          **Worth a look for anything odd** - overlapping nodes, missing edges, text spilling outside its box, a lopsided layout. The tests check that the geometry is computed correctly; whether it actually *looks* right is the one thing they cannot tell you, and the one thing this image is for.

          [Workflow run](https://github.com/$REPO/actions/runs/$RUN_ID)
          <sub>Generated by \`jsmind export\` from \`example/v2-features.json\`, pinned to this commit. Uploaded as a comment attachment, so it stays viewable for as long as this comment exists.</sub>
          BODY

          gh pr comment "$PR_NUMBER" \
            --repo "$REPO" \
            --body-file tmp/comment.md
