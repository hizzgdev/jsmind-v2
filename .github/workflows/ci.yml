name: CI

on:
  # Push to master only: branches under review are covered by the
  # pull_request trigger below, so pushing a feature branch twice (once
  # before opening the PR, once after) does not burn two runs.
  push:
    branches: [master]
  pull_request:
    branches: [master]

# New pushes to the same branch cancel older runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Everything that does not need a browser.
  # ---------------------------------------------------------------------------
  checks:
    name: Format, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Read-only on purpose: nothing here writes to the repository, so nothing
    # here should be able to.
    permissions:
      contents: read

    steps:
      # v7 runs on node24; v4 ran on node20, which GitHub deprecated.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # Deterministic install from the lockfile. This is npm's built-in
      # "npm ci", unrelated to the "ci" script in package.json.
      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format-check

      - name: Type check
        run: npm run type-check

      # Unit and data-layer suites only. The UI tests live in the job below,
      # because they drive a real browser against the built bundle.
      #
      # Coverage runs here and nowhere else. scripts.ci / ci2 and the pre-push
      # hook stay on test-lite / test on purpose: they are the manual and local
      # paths, where the full coverage report is slow and noisy. Thresholds live
      # in package.json (scripts.test:coverage).
      - name: Tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Everything that needs a browser, in the order it needs them:
  # build -> UI tests -> render.
  # ---------------------------------------------------------------------------
  ui:
    name: Build, UI tests, render preview
    runs-on: ubuntu-latest
    # Generous: the browser starts twice here (UI suite, then the preview
    # render), and a stalled start used to eat the whole budget silently.
    timeout-minutes: 15

    # The preview publishes an image to a branch and comments on the PR. Both
    # are writes; the checks job above deliberately does not get them.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Separate job, so it needs its own build. Passing dist/ between jobs
      # would mean an upload and a download - slower than the ~3 seconds this
      # takes.
      - name: Build
        run: npm run build

      # These drive a real browser against dist/jsmind.js rather than the
      # TypeScript sources, which is why they need the build above. Kept out of
      # test / test:coverage so that suite stays fast and needs no browser, and
      # so the manual packages (`npm run ci`) keep their order.
      - name: UI tests
        # A stalled browser start used to consume the whole job timeout; fail
        # this step on its own budget instead so the cause is obvious.
        timeout-minutes: 3
        run: npm run test:ui

      # -----------------------------------------------------------------------
      # Render preview
      #
      # Not a nicety. The tests prove the geometry is computed correctly and
      # cannot show whether the result looks like anything - that takes an
      # image someone can open. So it runs after the assertions, and a failure
      # here is a failure like any other.
      #
      # Pull requests only: a push to master has no comment to post into.
      # -----------------------------------------------------------------------

      - name: Render the example map
        if: github.event_name == 'pull_request'
        run: |
          node --experimental-strip-types --no-warnings scripts/render-preview.ts \
            examples/v2-features.json preview.png

      # The comment embeds this image with markdown, which needs a URL GitHub
      # serves as an image. Neither artifacts nor release assets qualify:
      # artifact URLs need auth and redirect to HTML, and release download URLs
      # arrive as `application/octet-stream` with `Content-Disposition:
      # attachment`, so GitHub treats them as a file to fetch rather than a
      # picture to draw. A file on a branch is served by
      # raw.githubusercontent.com as `image/png` - the one form that works, and
      # what reg-actions and awesome-copilot both document.
      #
      # Force-pushed so the branch always holds exactly one commit and one file;
      # done in a scratch directory so the checked-out tree is never disturbed.
      - name: Publish the image to the preview branch
        id: publish
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # The filename carries the commit, so an older pull request keeps
          # showing the image that matches its own code. A single shared
          # `preview.png` would be overwritten by every later run and quietly
          # rewrite history in every earlier comment.
          file="preview-${SHA}.png"
          echo "file=$file" >> "$GITHUB_OUTPUT"

          rm -rf /tmp/preview-branch
          if ! git clone -q --depth 1 --branch render-preview \
                 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
                 /tmp/preview-branch 2>/dev/null; then
            mkdir -p /tmp/preview-branch
            git -C /tmp/preview-branch init -q
          fi

          cd /tmp/preview-branch
          if [ -f "$file" ]; then
            echo "already published at this commit, nothing to do"
            exit 0
          fi

          cp preview.png "$file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git commit -q -m "preview: ${SHA:0:7}"
          git push -q \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            HEAD:render-preview
          echo "published ${SHA:0:7} as $file"

      - name: Post it on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          FULL_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          short="${COMMIT_SHA:0:7}"

          # Invisible marker so a re-run can find and replace this comment.
          # Without it every push would leave its own screenshot behind and the
          # pull request would collect a column of images, all but the last
          # describing code that no longer exists.
          MARKER='<!-- jsmind-render-preview -->'

          # Unquoted heredoc delimiter so $short interpolates; backticks are
          # escaped so the shell does not run them as commands.
          cat > /tmp/body.md <<BODY
          $MARKER
          ### Render preview

          ![jsMind render preview](https://raw.githubusercontent.com/$REPO/render-preview/preview-$FULL_SHA.png)

          Rendered from the latest code on this branch, at \`$short\`.

          **Worth a look for anything odd** - overlapping nodes, missing edges, text
          spilling outside its box, a lopsided layout. The tests check that the
          geometry is computed correctly; whether it actually *looks* right is the one
          thing they cannot tell you, and the one thing this image is for.

          [Workflow run](https://github.com/$REPO/actions/runs/$RUN_ID)
          <sub>Generated by \`scripts/render-preview.ts\` from \`examples/v2-features.json\`.
          The filename is the commit, so this image always matches the code above it.</sub>
          BODY

          # Clear any previous preview first. Deleting before posting means a
          # failure leaves the old image in place instead of no image at all.
          previous=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" || true)
          for id in $previous; do
            echo "removing previous preview comment $id"
            gh api -X DELETE "repos/$REPO/issues/comments/$id" || true
          done

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/body.md
          echo "posted"
