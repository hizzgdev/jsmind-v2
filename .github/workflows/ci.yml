name: CI

on:
  # Push to master only: branches under review are covered by the
  # pull_request trigger below, so pushing a feature branch twice (once
  # before opening the PR, once after) does not burn two runs.
  push:
    branches: [master]
  # Any PR base, not just master, so a stacked docs PR (for example one
  # whose base is this branch) still gets CI checks. Pages deploy in
  # static.yml remains master-only.
  pull_request:

# New pushes to the same branch cancel older runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Decides what the other jobs are worth running.
  #
  # Almost every change here touches documentation - this repository has more
  # prose than code, and a plan or a decision record is edited far more often
  # than the renderer. Rendering an image for those runs costs a browser
  # install, a build and a vision call's worth of context to look at, and
  # produces a picture identical to the one already on the pull request.
  #
  # Deliberately not `paths:` on the trigger: that skips the whole workflow,
  # and a documentation-only change still needs its formatting checked.
  # ---------------------------------------------------------------------------
  changes:
    name: Change detection
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    outputs:
      # 'true' when something that can change the rendered image moved.
      render: ${{ steps.paths.outputs.render }}
      # 'true' when every changed file is under docs/. File type (markdown,
      # VitePress config, ts/js/vue, ...) is not classified here.
      docs_only: ${{ steps.paths.outputs.docs_only }}
      # 'true' when something the published site carries changed: any file
      # under docs/, or any file under skills/ - the site build copies that
      # directory to the site root. The docs site job uses this to decide
      # whether to run; it then looks at which of those files moved.
      docs: ${{ steps.paths.outputs.docs }}
      # 'true' when a non-markdown file outside docs/ changed, so the
      # library type-check, unit tests, build and UI tests should run.
      # skills/ counts: a script or fixture shipped beside a skill is
      # non-markdown too, so only the markdown of a skill skips these checks.
      # Root README and other *.md files are prose: they do not set this,
      # and they also do not run or skip the docs site job.
      library: ${{ steps.paths.outputs.library }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The diff needs the base commit, which may be many commits back.
          # Cheap here - the repository is a few megabytes.
          fetch-depth: 0

      - name: Compare against the base
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE...$PR_HEAD"
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$PUSH_BEFORE...$PUSH_AFTER"
          else
            # First push to a new branch: no before-commit to diff against.
            # Assume the worst rather than silently skipping the render.
            echo "no usable base commit; running every check"
            echo "render=true" >> "$GITHUB_OUTPUT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "library=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! changed=$(git diff --name-only "$range"); then
            echo "::warning::could not diff $range; running every check"
            echo "render=true" >> "$GITHUB_OUTPUT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "library=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Independent questions, answered in one pass over the file list.
          #
          # render: can this change the picture? Paths whose contents feed the
          #   renderer. example/ is listed whole rather than just the fixture it
          #   renders: moving or renaming the fixture would break the preview,
          #   and the run that breaks it should be the run that shows it.
          #
          # docs_only: is every changed file under docs/? This layer does not
          #   subdivide docs/ by .vitepress, markdown, or ts/js/vue.
          #
          # docs: did anything under docs/ change? The docs site job runs when
          #   this is true, and then decides which checks to perform. `skills/`
          #   sets it too: the site build publishes that directory, so a change
          #   to a skill is a change to the published site.
          #
          # library: did a non-markdown file outside docs/ change? `skills/`
          #   does not opt out of this: a script or fixture beside a skill is
          #   non-markdown, so it sets library too. Root README and other *.md
          #   files are prose: they do not require library checks, and they do
          #   not run or skip the docs site job.
          #
          # These answers are not complements: a change only under docs/ is
          # docs_only and docs, not library; a README-only change is none of
          # docs_only, docs, or library; a change to
          # .github/workflows/static.yml is library but not docs; a change
          # to src/ is both library and render.
          render=false
          docs_only=true
          docs=false
          library=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue

            case "$file" in
              src/*|example/*|package.json|package-lock.json|tsconfig.json)
                render=true; echo "affects the render: $file" ;;
              .github/actions/render-map/*|.github/workflows/ci.yml)
                render=true; echo "affects the render: $file" ;;
              # The preview's own pipeline scripts. They are not library code,
              # but the data this run prepares and the command the action runs
              # are exactly what the picture depends on - a run that changed
              # them should be the run that shows the result.
              scripts/render-preview.ts|scripts/prepare-preview.ts)
                render=true; echo "affects the render: $file" ;;
            esac

            case "$file" in
              docs/*)
                docs=true
                echo "docs change: $file"
                ;;
              skills/*)
                # Published by the site build, so the pages-site test is what
                # has to see this change. The file type still decides whether
                # the library checks are worth a runner.
                docs=true
                docs_only=false
                case "$file" in
                  *.md)
                    echo "prose, published on the site: $file"
                    ;;
                  *)
                    library=true
                    echo "library checks needed (published on the site): $file"
                    ;;
                esac
                ;;
              *)
                docs_only=false
                case "$file" in
                  *.md)
                    echo "prose: $file"
                    ;;
                  *)
                    library=true
                    echo "library checks needed: $file"
                    ;;
                esac
                ;;
            esac
          done <<< "$changed"

          # No files at all is not "only documentation" - an empty diff means
          # the comparison itself failed to produce anything, and the library
          # checks should run rather than be skipped on a technicality.
          if [ -z "$changed" ]; then
            docs_only=false
            library=true
            echo "empty diff; running the library checks"
          fi

          echo "render=$render" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "library=$library" >> "$GITHUB_OUTPUT"

          if [ "$render" = "false" ]; then
            echo "nothing here can change the image; skipping the render"
          fi
          if [ "$library" = "false" ]; then
            echo "no library source changed; skipping type-check, unit tests, build and UI tests"
          fi
          if [ "$docs" = "true" ]; then
            echo "docs/ or skills/ changed; the docs site job will decide which checks to run"
          fi
          if [ "$docs_only" = "true" ]; then
            echo "all changes are under docs/"
          fi

  # ---------------------------------------------------------------------------
  # Everything that does not need a browser.
  #
  # Red here means the code is wrong: format, types, unit tests or the build.
  # Browsers are deliberately kept out so that stays true - a CI failure in this
  # job is never "the runner had a bad day".
  # ---------------------------------------------------------------------------
  checks:
    name: Format, types, tests, build
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Read-only on purpose: nothing here writes to the repository, so nothing
    # here should be able to.
    permissions:
      contents: read

    steps:
      # v7 runs on node24; v4 ran on node20, which GitHub deprecated.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # Deterministic install from the lockfile. This is npm's built-in
      # "npm ci", unrelated to the "ci" script in package.json.
      #
      # Runs even for documentation-only changes: prettier is a dependency, so
      # the format check below cannot work without it.
      - name: Install dependencies
        run: npm ci

      # The one step a documentation-only change actually needs. Markdown has
      # line width and list formatting rules like any other file, and they are
      # worth failing on.
      - name: Format check
        run: npm run format-check

      # Prose must not pin a patch version. `package.json` is the only source
      # of the version - the docs read it at build time and the README reads
      # npm - so a literal `2.0.x` in a page goes stale on the next release and
      # leaves the tagged tree describing the previous one. Its own step rather
      # than part of format-check: a violation here is a content mistake, not a
      # whitespace one, and the report is `file:line: content`.
      - name: Version references
        run: npm run version-check

      # The skill's frontmatter declares the CLI range it describes, and the
      # repository's own version has to be inside it. A second source of truth
      # is only acceptable when something compares it — this is that something,
      # and it runs on every change for the same reason version-check does:
      # `skills/` is watched, and a docs-only change is the change most likely
      # to leave the range behind.
      - name: Skill metadata
        run: npm run skill-meta-check

      # Everything below compiles or exercises the TypeScript library sources.
      # Changes that only touch docs/ or other markdown cannot change those
      # answers, so these steps are skipped. Docs-site checks live in the
      # docs-site job, not here.
      - name: Type check
        if: needs.changes.outputs.library == 'true'
        run: npm run type-check

      # Unit and data-layer suites only. The UI tests live in the job below,
      # because they drive a real browser against the built bundle.
      #
      # Coverage runs here and nowhere else. scripts.ci / ci2 and the pre-push
      # hook stay on test-lite / test on purpose: they are the manual and local
      # paths, where the full coverage report is slow and noisy. Thresholds live
      # in package.json (scripts.test:coverage).
      - name: Tests with coverage
        if: needs.changes.outputs.library == 'true'
        run: npm run test:coverage

      # The ui job builds again on its own rather than depending on this one and
      # downloading dist/ as an artifact. That round trip costs more than the
      # roughly three seconds a build takes — see the note there before adding
      # a `needs:` between the jobs.
      - name: Build
        if: needs.changes.outputs.library == 'true'
        run: npm run build

      # The weka webhook and the worktree cleaner are Python and live outside
      # the npm toolchain, so their tests need their own step. Stdlib `unittest`
      # only — no install, and python3 is already on the runner image. The weka
      # suite is where the "a human comment is never dropped" invariant is
      # enforced on every PR; `scripts/` holds the maintenance tools.
      - name: Webhook and maintenance-script tests
        if: needs.changes.outputs.library == 'true'
        run: |
          python3 -m unittest discover -s team/automations/weka -p 'test_*.py' -v
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          # The cleanup leans on what `git worktree remove` refuses; this probe
          # holds that rule down so a git release that changes it fails here.
          bash scripts/probe-worktree-removal.sh
          # The review-pass transition is shell so its ordering rule is testable:
          # `gh pr ready` must never run after a failed label cleanup.
          bash scripts/weka/test-pass-review.sh


  # ---------------------------------------------------------------------------
  # Docs site. Runs when anything under docs/ or skills/ changed. It does not
  # repeat the library type-check, coverage tests, or UI tests.
  #
  # This job looks at which of those files moved, then decides whether the
  # published VitePress site could have changed. docs/architecture/,
  # docs/features/, docs/requirements/, docs/images/, and docs/README.md
  # are excluded from the site. Changes under docs/.vitepress/, any
  # non-markdown file in docs/, any file under skills/ (the build copies that
  # directory to the site root), and changes to the published en/ and zh/
  # trees always run the site checks.
  # ---------------------------------------------------------------------------
  docs-site:
    name: Docs site
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The decision step diffs against the base commit.
          fetch-depth: 0

      - name: Decide whether the docs site is affected
        id: site
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          affected=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE...$PR_HEAD"
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$PUSH_BEFORE...$PUSH_AFTER"
          else
            echo "no usable base commit; running the docs site checks"
            echo "affected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! changed=$(git diff --name-only "$range"); then
            echo "::warning::could not diff $range; running the docs site checks"
            echo "affected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$changed" ]; then
            echo "empty diff; running the docs site checks"
            echo "affected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          affected=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docs/.vitepress/*)
                affected=true
                echo "docs site must be checked (vitepress): $file"
                ;;
              docs/architecture/*|docs/features/*|docs/requirements/*|docs/images/*|docs/README.md)
                echo "excluded from the docs site: $file"
                ;;
              skills/*)
                # The site publishes the skill directory at its root, and the
                # pages-site test is the only thing that checks the copy.
                affected=true
                echo "the skill directory is published on the site: $file"
                ;;
              docs/*)
                case "$file" in
                  *.md)
                    affected=true
                    echo "docs site content: $file"
                    ;;
                  *)
                    affected=true
                    echo "docs site must be checked (non-markdown): $file"
                    ;;
                esac
                ;;
            esac
          done <<< "$changed"

          echo "affected=$affected" >> "$GITHUB_OUTPUT"
          if [ "$affected" = "true" ]; then
            echo "the published docs site may have changed; running assemble-site / pages-site tests"
          else
            echo "docs/ changed, but the published site is not affected; skipping site checks"
          fi

      - name: Setup Node
        if: steps.site.outputs.affected == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        if: steps.site.outputs.affected == 'true'
        run: npm ci

      # The pages-site tests call assembleDocsSite (VitePress into _site/docs)
      # and the root-file fixture. That is the assemble-site / pages-site
      # check without rebuilding the library bundle.
      - name: Assemble and test the docs site
        if: steps.site.outputs.affected == 'true'
        run: node --test __tests__/build/pages-site.test.ts

  # ---------------------------------------------------------------------------
  # Needs a browser. Runs when the library may have changed, not when the
  # only changes are under docs/ or other markdown.
  #
  # These load dist/jsmind.js and drive it in a real browser. Documentation
  # is not compiled into that bundle, so a docs-only change would re-assert
  # yesterday's result against the same bytes. Docs-site checks are in the
  # docs-site job.
  # ---------------------------------------------------------------------------
  ui:
    name: UI tests
    needs: changes
    if: needs.changes.outputs.library == 'true'
    runs-on: ubuntu-latest
    # Generous: a stalled browser start used to eat the whole budget silently.
    timeout-minutes: 10

    # Read-only: the tests assert, they do not publish.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Separate job, so it needs its own build. Passing dist/ between jobs
      # would mean an upload and a download - slower than the ~3 seconds this
      # takes.
      - name: Build
        run: npm run build

      # These drive a real browser against dist/jsmind.js rather than the
      # TypeScript sources, which is why they need the build above. Kept out of
      # test / test:coverage so that suite stays fast and needs no browser, and
      # so the manual packages (`npm run ci`) keep their order.
      - name: UI tests
        # A stalled browser start used to consume the whole job timeout; fail
        # this step on its own budget instead so the cause is obvious.
        timeout-minutes: 3
        run: npm run test:ui

  # ---------------------------------------------------------------------------
  # Optional tests.
  #
  # Tests whose failure is information, not a gate. Several of them share one
  # job on purpose: a ruleset accepts or rejects a check as a whole, so a test
  # that must block a merge cannot sit in this bucket, and a test that arrives
  # later joins this job as another step rather than as a check of its own.
  #
  # Deliberately no `continue-on-error: true`. That turns the job's conclusion
  # into a success, so a red `Optional tests` would stop being visible - and if
  # anyone ever did mark the job required, the requirement would be vacuous.
  # The point is a failure someone can see and merge past, not a failure the
  # configuration hides.
  #
  # Gated on the classifier like the library jobs: a documentation-only change
  # has nothing here to run.
  # ---------------------------------------------------------------------------
  optional-tests:
    name: Optional tests
    needs: changes
    if: needs.changes.outputs.library == 'true'
    runs-on: ubuntu-latest
    # bash and jq only: no install and no build, so this is seconds.
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Hubie event filter decides which GitHub events wake the Coordinator
      # routine, and its unit tests are the only thing that exercises the
      # script. They used to be a second job in the forwarding workflow itself,
      # which meant a production workflow ran test work on pull request events
      # it otherwise never acts on.
      - name: Hubie event filter tests
        run: bash team/automations/hubie/forward-github-event.test.sh

  # ---------------------------------------------------------------------------
  # Render preview
  #
  # Pull requests only, and only those that changed something the renderer
  # reads. Two conditions rather than one, and both belong on the job: a push
  # to master has no comment to post into, and a documentation-only pull
  # request has nothing new to render.
  #
  # Not a nicety. The tests prove the geometry is computed correctly and cannot
  # show whether the result looks like anything - that takes an image someone can
  # open.
  #
  # Separate from the UI tests even though both need a browser: those are
  # assertions that must run on every commit, this produces a preview and
  # spends two tokens. Sharing an environment is not sharing a purpose.
  # ---------------------------------------------------------------------------
  preview:
    name: Render preview
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.render == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Three steps publish: one uploads an image, one deploys the page, one
    # comments. Writes are confined to this job.
    permissions:
      contents: read
      pull-requests: write

    steps:
      # v7 runs on node24; v4 ran on node20, which GitHub deprecated.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Its own build: passing dist/ between jobs would mean an upload and a
      # download, slower than the ~3 seconds this takes.
      - name: Build
        run: npm run build

      # The preview's whole preparation: the example map in, the file the render
      # reads out, with one tone drawn for this run. The two steps name the same
      # path, so the flow reads top to bottom.
      #
      # Nothing is captured from this step: it runs the script, and the
      # prepared file is the only thing that crosses from here to the render.
      # The tone drawn for this run is a field inside that file. The script
      # logs the name it wrote, so the job log still says which tone the
      # picture used; nothing carries the value from step to step.
      #
      # Random rather than fixed for two reasons: consecutive previews show
      # different tones, and a palette regression in a single tone has a run
      # that shows it.
      #
      # The name is read from `JmTone` in the model source by the script. It is
      # deliberately not a list here: a copy of the palette's names in YAML goes
      # stale the first time the palette changes, and the run that finds out is
      # one that drew a retired name and got refused - which reads like the job
      # broke rather than the copy. Every draw is a name the model accepts, so
      # the randomness cannot turn this job red.
      #
      # Onto a prepared copy, never onto the tracked fixture: the preview is
      # meant to show the repository's own data, so a run must not leave the
      # example file carrying this run's tone (or anyone's edit) for the next
      # one.
      - name: Prepare the render data
        run: |
          mkdir -p tmp
          node scripts/prepare-preview.ts example/v2-features.json tmp/preview-data.json

      # `transparent: true` is what makes this a transparent-background PNG.
      # The action's default is opaque - that default belongs to the action,
      # not to the one job that calls it - so the job that wants transparency
      # says so here. Pasted into a pull request comment, the transparent
      # area shows GitHub's own background - light or dark depending on the
      # reader's theme. That is a known cost of a real transparent image, not
      # something to paper over with a checkerboard or a filled background: a
      # painted backdrop would hide whether the export is transparent at all.
      - name: Render
        uses: ./.github/actions/render-map
        with:
          data-file: tmp/preview-data.json
          output: tmp/preview.png
          transparent: 'true'

      # The page this run exported, from the same prepared data as the image.
      #
      # It is what the comment's link opens. A preview is worth more as the
      # thing itself than as a picture of it, and both ways of shipping a file
      # put a gate in front of the reader: the comment-attachment endpoint only
      # takes images, and the artifact store asks them to sign in and hands back
      # a download. A published page is an address that opens on a click.
      #
      # One `run:` rather than a second composite action: `export html` writes a
      # file and never starts a browser, so the render action's launch retry
      # would be dead weight on this step.
      #
      # The same `tmp/preview-data.json` the image was rendered from, never the
      # tracked fixture: the page and the image then describe one map, down to
      # the tone this run drew.
      - name: Export the HTML page
        run: node dist/cli.js export html tmp/preview-data.json tmp/preview.html --title "jsMind preview"

      # The image goes up as a comment attachment, in two steps with different
      # tokens.
      #
      # Step one uploads to https://uploads.github.com/user-attachments/assets,
      # the endpoint gh's own --attach posts to, and gets back
      # https://github.com/user-attachments/assets/<uuid>. That URL names a blob,
      # not a commit, so rebases and force-pushes leave it alone - unlike the
      # render-preview branch it replaces, where each push renamed the file and
      # orphaned every earlier comment's image.
      #
      # Step two posts the comment with github.token, so it is attributed to
      # github-actions[bot] like every other CI comment. Using --attach would have
      # done both in one command but under a single credential, and there is no
      # way to say "upload as the maintainer, post as the bot" to a command that
      # only takes one token.
      #
      # Forks never receive repository secrets, so the upload warns and stops
      # rather than failing: the point of CI here is the tests, and the picture
      # is a courtesy.
      #
      # `continue-on-error` covers the other way this step goes wrong: the
      # maintainer's token expires or is revoked, the endpoint answers 401/403,
      # and the `exit 1` below would otherwise fail the job - taking `Deploy the
      # preview` and the comment down with it, so a run whose page published
      # fine would offer the reader nothing at all. With this flag a failed step
      # leaves `url` empty and the comment step says so in one line, which is
      # the shape issue #226 asks for: the image is the extra, the link is
      # the point. The `::error::` stays, so the failure still lands in the log
      # and the run's annotations instead of hiding behind a green job.
      - name: Upload the preview
        id: upload
        continue-on-error: true
        env:
          # Two credentials in one step, doing different jobs.
          #
          # GH_TOKEN is the bot's, and only reads the numeric repository id; it
          # makes no writes. gh refuses to run in Actions without it even for a
          # plain `gh api` read.
          #
          # UPLOAD_TOKEN is a maintainer's, and only performs the upload. The
          # endpoint rejects installation tokens with "attaching files requires
          # write access to the repository" - a statement about the kind of
          # credential, not about the permissions block above.
          GH_TOKEN: ${{ github.token }}
          UPLOAD_TOKEN: ${{ secrets.PR_PREVIEW_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${UPLOAD_TOKEN:-}" ]; then
            echo "::warning::PR_PREVIEW_TOKEN is not set; skipping the image upload."
            echo "::warning::Set it to a token with write access to $REPO, or forks never get a preview image."
            exit 0
          fi

          repo_id=$(gh api "repos/$REPO" --jq .id)

          # --data-binary, not --data: the latter mangles the payload. The query
          # string is what the endpoint reads for the content type, so it has to
          # survive URL encoding unchanged.
          response=$(curl -sS -X POST \
            "https://uploads.github.com/user-attachments/assets?content_type=image%2Fpng&name=preview.png&repository_id=$repo_id" \
            -H "Authorization: Bearer $UPLOAD_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @tmp/preview.png)

          url=$(printf '%s' "$response" | jq -r '.url // empty')
          if [ -z "$url" ]; then
            echo "::error::Upload failed: $response"
            exit 1
          fi

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "uploaded $(du -h tmp/preview.png | cut -f1) to $url"

      # The live preview: the exported page as its own revision on a shared
      # surge.sh domain, so the comment's link opens the map itself instead of a
      # file the reader has to fetch first.
      #
      # `--preview` publishes a revision and leaves production alone, and the
      # revision address is the one worth handing out: surge keeps the most
      # recent 100 per domain and drops the rest, so nothing here runs a
      # teardown. A domain that has never been published to production accepts a
      # preview as its first publish - measured on this domain, whose revision
      # list was empty beforehand and whose bare production address still
      # answers 404.
      #
      # Everything a maintainer needs to keep this running, in one place - the
      # domain, the secret name, how to re-issue an expired token, and how long
      # a revision lives:
      #
      #   domain    jsmind-v2-pr-preview.surge.sh
      #   secret    SURGE_TOKEN, repository secret, read by this step alone
      #   re-issue  surge tokens add --domain jsmind-v2-pr-preview.surge.sh -m ci
      #             then store the token it prints as SURGE_TOKEN again; nothing
      #             in this file changes when it is rotated
      #   lifetime  surge keeps the 100 most recent revisions per domain and
      #             drops older ones, so a preview link eventually 404s and a
      #             re-run of this job produces a fresh one
      #
      # A revoked token fails the way the rest of this step fails: surge aborts,
      # the log says why, the job stays green and the comment loses its link.
      # A comment that has stopped carrying a link is the symptom to look for.
      #
      # `npx --yes`: without it npx stops on "Ok to proceed?" and waits for a
      # tty a runner does not have, until the job times out.
      #
      # The token comes from the environment and never from `--token`: staying
      # out of the log is the entire reason `SURGE_TOKEN` exists as a variable,
      # and a command-line argument is kept. Step-scoped rather than job-level
      # for the same reason the image's credential is - this job already holds
      # two, and a third readable by every step buys nothing.
      #
      # `continue-on-error` for the same reason the image warns instead of
      # failing on a fork: the picture is the preview, this is the extra, and a
      # deploy having a bad day must not cost the reader the image. A failure
      # leaves `url` empty and the comment step says so in one line. A fork
      # has no secret at all, so it warns and stops - never exit 1.
      - name: Deploy the preview
        id: surge
        continue-on-error: true
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          set -euo pipefail

          DOMAIN=jsmind-v2-pr-preview.surge.sh

          if [ -z "${SURGE_TOKEN:-}" ]; then
            echo "::warning::SURGE_TOKEN is not set; skipping the preview deploy."
            echo "::warning::Set it to a surge token for $DOMAIN, or forks never get a live preview."
            exit 0
          fi

          # The address is read off surge's own output rather than assembled
          # here: the revision id is a timestamp the service picks, so there is
          # nothing local to build it from.
          #
          # Colours are stripped first. Piped output loses them on a developer's
          # machine, but a CI environment - or anyone who exported FORCE_COLOR -
          # puts them back, and then the address arrives wrapped in escape codes
          # no pattern matches. Measured on this exact command: the same publish
          # under `CI=true FORCE_COLOR=1` emits 29 escape sequences around this
          # line, and the substitution below leaves none of them.
          #
          # Both commands below are allowed to report a failure instead of being
          # allowed to end the script on one. Under `set -e` a bare
          # `out=$(npx ...)` exits on a non-zero status before the next line
          # runs, so the output collected here with `2>&1` - the only account of
          # what surge said - would never reach the log, and `grep` finding no
          # address (status 1, promoted by `pipefail`) would end the script
          # inside an assignment, making the `-z` branch below unreachable.
          if ! out=$(npx --yes surge tmp/preview.html "$DOMAIN" --preview 2>&1); then
            printf '%s\n' "$out"
            echo "::error::surge exited non-zero; the comment will have no link."
            exit 1
          fi

          plain=$(printf '%s' "$out" | sed -r 's/\x1b\[[0-9;]*[mK]//g')
          host=$(printf '%s' "$plain" | grep -oE "[0-9]+--${DOMAIN//./\\.}" | tail -1 || true)

          if [ -z "$host" ]; then
            printf '%s\n' "$plain"
            echo "::error::surge published no preview address; the comment will have no link."
            exit 1
          fi

          echo "url=https://$host" >> "$GITHUB_OUTPUT"
          echo "published $host"

      - name: Post it on the pull request
        if: steps.upload.outputs.url != '' || steps.surge.outputs.url != ''
        env:
          # github.token rather than secrets.GITHUB_TOKEN: same credential, but
          # present in every context and impossible to shadow with a secret.
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # The head commit. The footnote prints its first seven characters,
          # so only the trimmed form is used.
          FULL_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          # The revision address the deploy step published, empty when it
          # skipped (a fork has no secret) or failed - which is how the body
          # below learns to replace its section with a status line. Read from
          # the step's output rather than rebuilt here, because the revision id
          # is surge's.
          PAGE_URL: ${{ steps.surge.outputs.url }}
        run: |
          set -euo pipefail
          short="${FULL_SHA:0:7}"

          # Two of the comment's sections can be missing, and a missing one is
          # replaced whole: a run that uploaded no image says so in one line
          # instead of carrying a paragraph about a picture the reader cannot
          # see. The step's `if:` already skips the both-empty case; the
          # warning in the log says which half went missing.
          #
          # Everything else in the body is fixed text, written once below.
          if [ -n "${PREVIEW_URL:-}" ]; then
            image_section=$(printf '%s\n\n%s' \
              "**Image** — the layout of \`example/v2-features.json\`, one transparent PNG. Look for what the tests can't assert: overlapping nodes, missing edges, text outside its box, a lopsided layout." \
              "![jsMind render preview]($PREVIEW_URL)")
          else
            image_section='**Image** — _did not upload for this run._'
            echo "::warning::the image did not upload; posting the comment without it"
          fi

          # A failed deploy still says so: a comment that silently drops the
          # link reads as if this repository never had a live preview, which is
          # the one thing that is not true.
          if [ -n "${PAGE_URL:-}" ]; then
            page_section=$(printf '%s\n\n%s' \
              "**Page** — the same map as one self-contained \`.html\` — what a reader gets from \`jsmind export html\`. Open it for fonts, scrolling and loading with no network." \
              "[Open the exported page]($PAGE_URL)")
          else
            page_section='**Page** — _not published for this run._'
            echo "::warning::the preview did not deploy; the comment says so"
          fi

          # Invisible marker so a re-run can find and replace this comment.
          # Without it every push would leave its own screenshot behind and the
          # pull request would collect a column of images, all but the last
          # describing code that no longer exists.
          MARKER='<!-- jsmind-render-preview -->'

          # Clear any previous preview first. Deleting before posting means a
          # failure leaves the old image in place instead of no image at all.
          previous=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" || true)
          for id in $previous; do
            echo "removing previous preview comment $id"
            gh api -X DELETE "repos/$REPO/issues/comments/$id" || true
          done

          # Unquoted heredoc delimiter so the variables interpolate; backticks
          # are escaped so the shell does not run them as commands.
          #
          # Every paragraph below is one long line on purpose. GitHub renders
          # comments with breaks:true, so a single newline becomes a <br> -
          # wrapping a sentence to fit the source column posts it as a stack of
          # short lines instead of the paragraph it reads as here.
          cat > tmp/comment.md <<BODY
          $MARKER
          $image_section

          $page_section

          <sub>\`$short\` · [workflow run](https://github.com/$REPO/actions/runs/$RUN_ID)</sub>
          BODY

          gh pr comment "$PR_NUMBER" \
            --repo "$REPO" \
            --body-file tmp/comment.md
