# Weka webhook reverse proxy.
#
# Drop this into /etc/nginx/conf.d/ (it is a standalone server block), then
# `nginx -t && systemctl reload nginx`.
#
# The Python bridge binds 127.0.0.1:9180; only nginx faces the public net.
# GitHub posts directly to http://<public-ip>:<webhook-port>. Serve by IP, not
# a domain — a domain on a mainland server needs ICP filing, an IP does not.
# Replace <public-ip> and <webhook-port> with the real values before deploying.
server {
    listen <webhook-port>;
    server_name _;

    # GitHub webhook source IPs — `curl https://api.github.com/meta` -> hooks.
    # GitHub rotates these over time; if events stop arriving, diff this list
    # against the API FIRST before debugging anything else.
    allow 9.234.106.48/28;
    allow 9.234.98.160/28;
    allow 9.234.98.176/28;
    allow 192.30.252.0/22;
    allow 185.199.108.0/22;
    allow 140.82.112.0/20;
    allow 143.55.64.0/20;
    allow 2a0a:a440::/29;
    allow 2606:50c0::/32;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:9180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Keep the GitHub auth + routing headers intact to the bridge.
        proxy_set_header X-GitHub-Event $http_x_github_event;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_set_header X-GitHub-Delivery $http_x_github_delivery;
    }
}
